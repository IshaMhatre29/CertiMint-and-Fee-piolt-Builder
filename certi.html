<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CertiMint & FeePilot | Admin Login</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        /* ==========================================================================
           1. DESIGN TOKENS (RICH BROWN & BEIGE PALETTE)
           ========================================================================== */
        :root {
            /* Base Workspace & Elevation */
            --bg-base: #F5EFEB;            /* Warm Cream Beige Main Workspace */
            --surface-card: #FFFFFF;       /* Crisp Pure White Surface */
            --surface-subtle: #EFE8E1;     /* Soft Beige Secondary Elevation */
            --surface-hover: #E4D9CE;      /* Warm Beige Hover State */

            /* Dark Brand Accents (Rich Dark Espresso) */
            --brand-espresso: #2C1E16;     /* Deep Rich Espresso Brown */
            --brand-dark-hover: #3D2C20;   /* Rich Brown Hover State */

            /* Borders */
            --border-color: #DCD0C3;       /* Soft Sand/Beige Border */
            --border-focus: #5A3E2B;       /* Deep Brown Focus Accent */

            /* Typography */
            --text-main: #21160E;          /* Deep Dark Espresso Text */
            --text-muted: #665547;         /* Warm Taupe Muted Text */
            --text-on-dark: #F8F4EF;       /* Cream White Text */

            /* Accents */
            --accent-primary: #5A3E2B;     /* Rich Warm Brown Accent */
            --accent-hover: #402A1C;       /* Dark Chocolate Hover */

            /* Status Colors */
            --danger-color: #A93226;      /* Rich Deep Crimson */
            --danger-bg: #FADBD8;         /* Soft Crimson Tint */
            --success-color: #1E8449;     /* Deep Emerald Green */
            --success-bg: #D4EFDF;        /* Soft Emerald Tint */

            /* Layout & Shadows */
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --shadow-sm: 0 4px 12px rgba(44, 30, 22, 0.05);
            --shadow-lg: 0 20px 40px rgba(44, 30, 22, 0.12);
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ==========================================================================
           2. RESET & BASE
           ========================================================================== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* ==========================================================================
           3. PROFESSIONAL LOGIN CONTAINER
           ========================================================================== */
        .login-wrapper {
            width: 100%;
            max-width: 900px;
            background-color: var(--surface-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            display: grid;
            grid-template-columns: 1fr 1fr;
            overflow: hidden;
        }

        /* Brand Side Panel */
        .brand-panel {
            background-color: var(--brand-espresso);
            color: var(--text-on-dark);
            padding: 48px 36px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .brand-panel-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-panel-header .icon {
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-on-dark);
            border-radius: var(--radius-md);
            display: grid;
            place-items: center;
            font-size: 1.25rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .brand-panel-header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .brand-panel-body {
            margin: 40px 0;
        }

        .brand-panel-body h2 {
            font-size: 1.75rem;
            font-weight: 700;
            line-height: 1.3;
            color: #FFFFFF;
            margin-bottom: 12px;
        }

        .brand-panel-body p {
            color: var(--border-color);
            font-size: 0.9375rem;
            line-height: 1.6;
        }

        .brand-panel-footer {
            font-size: 0.8125rem;
            color: var(--border-color);
            opacity: 0.8;
        }

        /* Form Side Panel */
        .form-panel {
            padding: 48px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-header {
            margin-bottom: 28px;
        }

        .form-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }

        .form-header p {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Form Input Styling */
        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            font-size: 0.95rem;
            transition: var(--transition);
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            background-color: var(--bg-base);
            color: var(--text-main);
            font-size: 0.875rem;
            font-family: inherit;
            outline: none;
            transition: var(--transition);
        }

        .input-wrapper input:focus {
            border-color: var(--border-focus);
            background-color: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(90, 62, 43, 0.1);
        }

        .input-wrapper input:focus + i {
            color: var(--accent-primary);
        }

        /* Login Button */
        button.btn-login {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-primary);
            color: #FFFFFF;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.9375rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: var(--transition);
            margin-top: 8px;
        }

        button.btn-login:hover {
            background-color: var(--accent-hover);
            box-shadow: var(--shadow-sm);
        }

        /* Feedback Banner Message */
        #message {
            margin-top: 20px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.8125rem;
            font-weight: 600;
            text-align: center;
            display: none;
        }

        #message.success {
            display: block;
            background-color: var(--success-bg);
            color: var(--success-color);
            border: 1px solid rgba(30, 132, 73, 0.2);
        }

        #message.error {
            display: block;
            background-color: var(--danger-bg);
            color: var(--danger-color);
            border: 1px solid rgba(169, 50, 38, 0.2);
        }

        /* Responsiveness */
        @media (max-width: 768px) {
            .login-wrapper {
                grid-template-columns: 1fr;
            }

            .brand-panel {
                padding: 32px 24px;
            }

            .form-panel {
                padding: 32px 24px;
            }
        }
    </style>
</head>

<body>

<div class="login-wrapper">

    <!-- Brand / Information Side Panel -->
    <div class="brand-panel">
        <div class="brand-panel-header">
            <div class="icon">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <h1>CertiMint & FeePilot</h1>
        </div>

        <div class="brand-panel-body">
            <h2>Administrative Workspace</h2>
            <p>Unified portal for managing course completion certificates, student records, and fee receipts.</p>
        </div>

        <div class="brand-panel-footer">
            © 2026 Ganishka Enterprises. All rights reserved.
        </div>
    </div>

    <!-- Interactive Login Form Side Panel -->
    <div class="form-panel">
        <div class="form-header">
            <h2>Admin Sign In</h2>
            <p>Please enter your credentials to access the system.</p>
        </div>

        <form onsubmit="event.preventDefault(); login();">
            <div class="input-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <input type="text" id="username" placeholder="Enter your username" autocomplete="username" required>
                    <i class="fa-solid fa-user"></i>
                </div>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
                    <i class="fa-solid fa-lock"></i>
                </div>
            </div>

            <button type="submit" class="btn-login">
                Sign In
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <div id="message"></div>
    </div>

</div>

<script>
function login() {
    let username = document.getElementById("username").value.trim();
    let password = document.getElementById("password").value.trim();
    let message = document.getElementById("message");

    if (username === "admin" && password === "admin123") {
        message.className = "success";
        message.innerHTML = '<i class="fa-solid fa-circle-check"></i> Authentication Successful. Redirecting...';

        setTimeout(function() {
            window.location.href = "dashboard.html";
        }, 800);

    } else {
        message.className = "error";
        message.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> Invalid Username or Password';
    }
}
</script>

</body>
</html>
